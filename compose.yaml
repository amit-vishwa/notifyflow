services:
  mysql:
    image: mysql:8.4
    container_name: notifyflow-mysql
    restart: unless-stopped

    ports:
      - "127.0.0.1:3306:3306"

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Root password required}
      MYSQL_DATABASE: notifyflow_db
      MYSQL_USER: notifyflow_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?App password required}

    volumes:
      - notifyflow_mysql_data:/var/lib/mysql

volumes:
  notifyflow_mysql_data:
